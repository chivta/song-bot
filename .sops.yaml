    # as `ruscan-sops-age` and which the songbot Kustomization decrypts with,
    # plus the local dev key so these files can be edited without the cluster.
    age: >-
      age10d00xrpljw4cga37ad0gt7se4nsehp5uv8yy3grkfqygd4pzyffqj3gr46,
      age1sh4gkd6vtq97pl0fwc43mfq5sh5f0a92t2zm8ktk5h3fln0cs43qfpgm3t
