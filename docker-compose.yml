# Local development only. Never used for staging or production.
services:
  songbot:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DB_PATH: /app/data/songbot.db
      YTDLP_DIR: /app/data/bin
      WORK_DIR: /tmp/songbot
    volumes:
      - .:/app
      - songbot-data:/app/data
    ports:
      - "8080:8080"

volumes:
  songbot-data:
