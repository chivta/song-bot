apiVersion: apps/v1
kind: Deployment
metadata:
  name: songbot
  namespace: songbot
  labels:
    app: songbot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The SQLite file lives on a ReadWriteOnce volume, so the old pod must be gone
  # before the new one starts. A rolling update would deadlock on the mount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: songbot
  template:
    metadata:
      labels:
        app: songbot
    spec:
      # Long enough for a download that is already uploading to Telegram to
      # finish; anything slower is cut off and the user simply asks again.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: songbot
          image: ghcr.io/chivta/song-bot:483eef7b91811cfd90e11210668259a3c004de38
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DB_PATH
              value: /app/data/songbot.db
            - name: YTDLP_DIR
              value: /app/data/bin
            - name: WORK_DIR
              value: /tmp/songbot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          # On a cold volume the first start downloads yt-dlp before the bot is
          # of any use. The startup probe gives that up to five minutes, and
          # holds the liveness probe off until it succeeds.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: songbot
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
      imagePullSecrets:
        - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: songbot-svc
  namespace: songbot
  labels:
    app: songbot
spec:
  selector:
    app: songbot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
