apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: songbot

resources:
  - namespace.yaml
  # Both secrets are encrypted to the shared ruscan age key, which Flux holds
  # in-cluster as `ruscan-sops-age`, and to the local dev key. They are the only
  # copies: there is no plaintext twin, so edit them in place with
  # `sops k8s/secrets/<file>.enc.yaml`.
  - secrets/app-secrets.enc.yaml
  # The registry pull secret lives in git too, so nothing has to be created by
  # hand before Flux can reconcile this app.
  - secrets/ghcr-secret.enc.yaml
  - bot/pvc.yaml
  - bot/deployment.yaml
